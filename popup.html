<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Auto Tab Groups</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 13px;
      width: 280px;
      background: #f8f9fa;
      color: #212529;
    }

    header {
      background: #4f46e5;
      color: #fff;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    header img { width: 20px; height: 20px; }

    header h1 {
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.02em;
    }

    .content { padding: 12px 16px; }

    #status {
      font-size: 12px;
      color: #6c757d;
      margin-bottom: 10px;
    }

    #groups-list {
      list-style: none;
      margin-bottom: 12px;
      max-height: 260px;
      overflow-y: auto;
    }

    #groups-list li {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 8px;
      border-radius: 6px;
      margin-bottom: 4px;
      background: #fff;
      border: 1px solid #e9ecef;
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .domain { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .count  { font-size: 11px; color: #6c757d; }

    #regroup-btn {
      width: 100%;
      padding: 8px;
      background: #4f46e5;
      color: #fff;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
      transition: background 0.15s;
    }

    #regroup-btn:hover  { background: #4338ca; }
    #regroup-btn:active { background: #3730a3; }

    .empty {
      text-align: center;
      color: #adb5bd;
      padding: 20px 0;
      font-size: 12px;
    }

    /* colour swatches matching Chrome tabGroups colours */
    .color-blue   { background: #1a73e8; }
    .color-red    { background: #d93025; }
    .color-yellow { background: #f9ab00; }
    .color-green  { background: #1e8e3e; }
    .color-pink   { background: #d01884; }
    .color-purple { background: #a142f4; }
    .color-cyan   { background: #007b83; }
    .color-orange { background: #e37400; }
    .color-grey   { background: #80868b; }
  </style>
</head>
<body>
  <header>
    <img src="icons/icon48.png" alt="icon" />
    <h1>Auto Tab Groups</h1>
  </header>

  <div class="content">
    <p id="status">Loading…</p>
    <ul id="groups-list"></ul>
    <button id="regroup-btn">Regroup Tabs Now</button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
