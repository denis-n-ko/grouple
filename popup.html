<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Auto Tab Groups</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 13px;
      width: 360px;
      background: #f8f9fa;
      color: #212529;
    }

    header {
      background: #4f46e5;
      color: #fff;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    header img { width: 20px; height: 20px; }

    header h1 {
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.02em;
    }

    .content { padding: 12px 16px; }

    #status {
      font-size: 12px;
      color: #6c757d;
      margin-bottom: 10px;
    }

    #groups-list {
      list-style: none;
      margin-bottom: 12px;
      max-height: 360px;
      overflow-y: auto;
    }

    #groups-list li {
      border-radius: 6px;
      margin-bottom: 4px;
      background: #fff;
      border: 1px solid #e9ecef;
      overflow: hidden;
    }

    .group-header {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 8px;
      cursor: pointer;
      user-select: none;
    }

    .group-header:hover { background: #f1f3f5; }

    .group-move {
      border: none;
      background: transparent;
      color: #6c757d;
      font-size: 12px;
      line-height: 1;
      padding: 1px 4px;
      border-radius: 4px;
      cursor: pointer;
      flex-shrink: 0;
    }

    .group-move:hover {
      background: #dee2e6;
      color: #212529;
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .domain { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .count  { font-size: 11px; color: #6c757d; }

    .chevron {
      font-size: 10px;
      color: #6c757d;
      transition: transform 0.15s;
      flex-shrink: 0;
    }

    .chevron.open { transform: rotate(90deg); }

    .tabs-list {
      display: none;
      list-style: none;
      border-top: 1px solid #e9ecef;
    }

    .tabs-list.open { display: block; }

    .tab-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 5px 8px 5px 20px;
      cursor: pointer;
    }

    .tab-item:hover { background: #e9ecef; }

    .tab-favicon {
      width: 14px;
      height: 14px;
      flex-shrink: 0;
      object-fit: contain;
    }

    .tab-title {
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 12px;
      color: #495057;
    }

    .tab-item.active-tab .tab-title { font-weight: 600; color: #212529; }

    .tab-close {
      display: none;
      background: none;
      border: none;
      cursor: pointer;
      color: #6c757d;
      font-size: 14px;
      line-height: 1;
      padding: 0 2px;
      flex-shrink: 0;
      border-radius: 3px;
    }

    .tab-item:hover .tab-close { display: block; }
    .tab-close:hover { background: #dee2e6; color: #212529; }

    #regroup-btn {
      width: 100%;
      padding: 8px;
      background: #4f46e5;
      color: #fff;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
      transition: background 0.15s;
    }

    #regroup-btn:hover  { background: #4338ca; }
    #regroup-btn:active { background: #3730a3; }

    .empty {
      text-align: center;
      color: #adb5bd;
      padding: 20px 0;
      font-size: 12px;
    }

    /* colour swatches matching Chrome tabGroups colours */
    .color-blue   { background: #1a73e8; }
    .color-red    { background: #d93025; }
    .color-yellow { background: #f9ab00; }
    .color-green  { background: #1e8e3e; }
    .color-pink   { background: #d01884; }
    .color-purple { background: #a142f4; }
    .color-cyan   { background: #007b83; }
    .color-orange { background: #e37400; }
    .color-grey   { background: #80868b; }

    #search {
      display: block;
      width: 100%;
      padding: 6px 10px;
      font-size: 13px;
      border: 1px solid #dee2e6;
      border-radius: 6px;
      outline: none;
      margin-bottom: 8px;
      background: #fff;
      color: #212529;
    }

    #search:focus {
      border-color: #4f46e5;
      box-shadow: 0 0 0 2px rgba(79, 70, 229, 0.15);
    }

    #shortcut-hint {
      margin: -2px 0 8px;
      font-size: 11px;
      color: #6c757d;
      line-height: 1.3;
    }

    #shortcut-hint kbd {
      font-family: inherit;
      font-size: 11px;
      border: 1px solid #ced4da;
      border-bottom-width: 2px;
      border-radius: 4px;
      padding: 0 4px;
      background: #fff;
      color: #495057;
      white-space: nowrap;
    }

    .nav-focus {
      outline: 2px solid #4f46e5;
      outline-offset: -2px;
      border-radius: 4px;
    }

    .ungrouped-li {
      margin-top: 8px;
      border-top: 1px solid #dee2e6 !important;
    }

    .tab-index {
      display: none;
      font-size: 10px;
      font-weight: 700;
      color: #fff;
      background: #4f46e5;
      border-radius: 3px;
      padding: 0 4px;
      min-width: 16px;
      height: 16px;
      line-height: 16px;
      text-align: center;
      flex-shrink: 0;
    }
  </style>
</head>
<body>
  <header>
    <img src="icons/icon48.png" alt="icon" />
    <h1>Auto Tab Groups</h1>
  </header>

  <div class="content">
    <p id="status">Loading…</p>
    <input type="search" id="search" placeholder="Search groups and tabs…" autocomplete="off" />
    <p id="shortcut-hint" aria-label="Popup shortcuts: Control Shift left bracket folds all groups, Control Shift right bracket unfolds all groups, and Control Shift G focuses the current tab group.">
      <kbd>Ctrl</kbd>+<kbd>Shift</kbd>+<kbd>[</kbd> fold all ·
      <kbd>Ctrl</kbd>+<kbd>Shift</kbd>+<kbd>]</kbd> unfold all ·
      <kbd>Ctrl</kbd>+<kbd>Shift</kbd>+<kbd>G</kbd> focus current group
    </p>
    <ul id="groups-list"></ul>
    <button id="regroup-btn">Regroup Tabs Now</button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
