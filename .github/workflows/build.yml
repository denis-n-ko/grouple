name: Build Extension

on:
  push:
    branches: ['**']
    tags-ignore: ['**']
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate extension files
        run: |
          node --check background.js
          node --check content.js
          node --check popup.js
          node -e "JSON.parse(require('fs').readFileSync('manifest.json', 'utf8'))"

      - name: Determine artifact name
        id: name
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "artifact=grouple-pr${{ github.event.pull_request.number }}" >> "$GITHUB_OUTPUT"
          else
            SAFE="${{ github.ref_name }}"
            SAFE="${SAFE//\//-}"
            SAFE="${SAFE//#/-}"
            echo "artifact=grouple-${SAFE}" >> "$GITHUB_OUTPUT"
          fi

      - name: Package extension
        run: |
          zip -r "${{ steps.name.outputs.artifact }}.zip" \
            manifest.json background.js content.js popup.html popup.js icons/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.name.outputs.artifact }}
          path: ${{ steps.name.outputs.artifact }}.zip
          retention-days: 30
