name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Validate release tag version
        run: |
          test "$(node -p "/^[0-9]+(\\.[0-9]+){1,3}$/.test('${{ steps.version.outputs.version }}')")" = "true"

      - name: Stamp version into manifest
        run: |
          sed -i "s/\"version\": \"[^\"]*\"/\"version\": \"${{ steps.version.outputs.version }}\"/" manifest.json
          node -e "JSON.parse(require('fs').readFileSync('manifest.json', 'utf8'))"

      - name: Package extension
        run: |
          zip -r "grouple-${{ github.ref_name }}.zip" \
            manifest.json background.js content.js popup.html popup.js icons/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Grouple ${{ github.ref_name }}
          files: grouple-${{ github.ref_name }}.zip
          generate_release_notes: true
